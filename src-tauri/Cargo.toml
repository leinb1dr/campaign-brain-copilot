[package]
name = "campaign-brain-copilot"
version = "0.1.0"
description = "Campaign Brain Co Pilot"
authors = ["GitHub Copilot"]
edition = "2021"
# Highest MSRV in the resolved dependency tree; older toolchains fail to build it.
rust-version = "1.88"

[lib]
name = "campaign_brain_copilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = ["desktop-app"]
desktop-app = ["dep:tauri"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
regex = "1.12.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tauri = { version = "2.8.5", features = [], optional = true }
